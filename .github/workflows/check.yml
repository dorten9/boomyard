# Checks a work branch the way the live build would: core checks, the WebGL player and the same smoke test,
# but deploys nothing. Lets changes prove themselves before main. Skipped without the Unity secrets.
name: Branch check

on:
  push:
    branches: ['claude/**', 'dev']
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.s.outputs.ok }}
    steps:
      - id: s
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::UNITY_LICENSE is not set; skipping the Unity build."; fi

  webgl:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      # The Unity 6.6 editor gets OOM-killed (exit 137) on 8 GB runners without swap.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 14G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Core checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-runtime >/dev/null
          Tools/SimTest/run.sh

      - name: Build WebGL
        id: build
        # Builds that import new assets are sometimes OOM-killed as the editor starts its second session;
        # the same commit then builds fine. One automatic retry below instead of a manual re-run.
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BoomYard.EditorTools.BuildScript.BuildWebGL
          allowDirtyBuild: true
          dockerMemoryLimit: 20g

      - name: Free memory before the retry
        if: steps.build.outcome == 'failure'
        run: |
          docker ps -q | xargs -r docker kill || true
          sync && echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          sudo rm -rf build Library
          sudo git -c safe.directory='*' reset -q --hard HEAD
          sudo git -c safe.directory='*' clean -ffdxq -e Library

      - name: Restore Library for the retry
        if: steps.build.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL (retry)
        if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BoomYard.EditorTools.BuildScript.BuildWebGL
          allowDirtyBuild: true
          dockerMemoryLimit: 20g

      - name: Find build output
        id: out
        run: |
          dir=$(dirname "$(find build -name index.html | head -1)")
          echo "Build output: $dir"
          ls -la "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Never deploy a broken build: the title screen must render (a missing shader paints it magenta).
      - name: Smoke test
        run: |
          site="$RUNNER_TEMP/smoke-site"
          rm -rf "$site" && cp -r "${{ steps.out.outputs.dir }}" "$site"
          (cd "$site" && python3 -m http.server 8090 >/dev/null 2>&1 &)
          cd Tools/screenshots
          npm init -y >/dev/null
          npm i --no-save playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node smoke.mjs http://localhost:8090 "$RUNNER_TEMP/smoke.png"
          pip install -q pillow
          python3 smoke_check.py "$RUNNER_TEMP/smoke.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BoomYard-WebGL
          path: |
            ${{ steps.out.outputs.dir }}
            ${{ runner.temp }}/smoke.png

      # A timeline of screenshots (title, play, a scripted explosion) pushed to the "screenshots" branch for review.
      - name: Screenshots
        continue-on-error: true
        run: |
          site="$RUNNER_TEMP/shots-site"
          rm -rf "$site" && cp -r "${{ steps.out.outputs.dir }}" "$site"
          (cd "$site" && python3 -m http.server 8091 >/dev/null 2>&1 &)
          cd Tools/screenshots
          node shoot.mjs http://localhost:8091 "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP/shots"
          echo "Build of ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="boomyard-ci" -c user.email="ci@boomyard.invalid" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
