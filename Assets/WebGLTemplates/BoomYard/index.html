<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0c0b0d">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="BoomYard">
  <link rel="manifest" href="site.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #0c0b0d; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    /* Landscape game: a phone-shaped frame on desktop (19.5:9), full screen on phones. */
    #frame { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); margin: 0 auto; width: 100%; max-height: 100%; aspect-ratio: 19.5 / 9; box-shadow: 0 0 80px rgba(255, 122, 26, 0.18); }
    @media (pointer: coarse) { #frame { top: 0; bottom: 0; transform: none; height: 100%; aspect-ratio: auto; box-shadow: none; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0c0b0d; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 60% 35%, #3a2216, #0c0b0d 70%); font-family: system-ui, -apple-system, sans-serif; color: #ebe6df; }
    #loader .logo { font-size: 13vmin; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
    #loader .tag { margin-top: 1.5vmin; font-size: 3.4vmin; color: #ffb347; }
    #loader .bar { width: 40%; height: 6px; margin-top: 5vmin; border-radius: 3px; background: #2c282d; overflow: hidden; }
    #loader .fill { width: 0; height: 100%; background: #ff7a1a; transition: width .2s; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0c0b0d; color: #ebe6df; font: 600 6vmin system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 8vmin; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader"><div class="logo">BOOMYARD</div><div class="tag">מדליקים. סופרים. בורחים.</div><div class="bar"><div class="fill" id="fill"></div></div></div>
  </div>
  <div id="rotate">סובבו את הטלפון לרוחב<br>Turn your phone sideways</div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // The web build is the Low profile: cap the resolution for fill rate.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    };
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.getElementById("fill").style.width = (100 * p) + "%"; })
        .then(function (instance) { window.unityInstance = instance; document.getElementById("loader").remove(); })
        .catch(function (message) { window.unityError = String(message); alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
